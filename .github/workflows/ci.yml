name: CI

on:
  push:
    branches:
      - main
  pull_request:

# This workflow builds and tests code from pull requests. It needs nothing but
# read access to the repository, so it gets nothing else.
permissions:
  contents: read

jobs:
  release-check:
    name: Release checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: Release readiness check
        run: npm run release:check

      - name: GitHub Pages build check
        run: npm run qa:pages

      - name: Browser smoke test
        run: npm run qa:smoke

      - name: PWA offline test
        run: npm run qa:pwa
