name: CI

on:
  push:
    branches:
      - main
  pull_request:

# This workflow builds and tests code from pull requests. It needs nothing but
# read access to the repository, so it gets nothing else.
permissions:
  contents: read

jobs:
  release-check:
    name: Release checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Only the runtime dependencies ship to a browser. The dev toolchain is
      # audited too, but a build-tool advisory must not block a release the
      # deployed bundle is unaffected by, so it is reported without failing.
      - name: Audit runtime dependencies
        run: npm run audit:runtime

      - name: Audit dev dependencies (report only)
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: Release readiness check
        run: npm run release:check

      - name: GitHub Pages build check
        run: npm run qa:pages

      - name: Browser smoke test
        run: npm run qa:smoke

      - name: PWA offline test
        run: npm run qa:pwa
